# Etiket (v1.0.0 gibi) itildiğinde Windows ve macOS kurulumlarını derler
# ve GitHub Release'e yükler. Panel, releases/latest/download/... adresinden
# her zaman en güncel sürümü indirir (bkz. frontend/src/lib/desktopApp.js).
#
# İMZASIZ: Windows SmartScreen "bilinmeyen yayıncı", macOS Gatekeeper
# "tanımlanamayan geliştirici" uyarısı verir. Kurulum sayfasında
# kullanıcıya nasıl açacağı anlatılır.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/MotoFull-Setup.exe
            dist/MotoFull-mac.dmg
          fail_on_unmatched_files: false
